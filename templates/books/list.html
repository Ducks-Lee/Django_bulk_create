<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>
</head>
<body>
    <h1>도서 목록</h1>

    <table border="1">
        <thead>
            <tr>
                <th>제목</th>
                <th>저자</th>
                <th>가격</th>
                <th>출판일</th>
                <th>재고</th>
            </tr>
        </thead>

        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.price }}</td>
                <td>{{ book.published_date }}</td>
                <td>{{ book.stock }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">등록된 도서가 없습니다.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
