<!-- student_list.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학생 목록</title>
</head>
<body>
    <h1>학생 목록</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>나이</th>
                <th>이메일</th>
                <th>생성일</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.age }}</td>
                    <td>{{ student.email }}</td>
                    <td>{{ student.created_at }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="5">등록된 학생이 없습니다.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
